name: Build Telegram APK

on:
  workflow_dispatch: # Запуск только вручную через панель GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Загрузка исходного кода вашего форка со всеми подмодулями
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Установка рабочей среды Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настройка и кэширование Gradle для ускорения сборки
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Компиляция APK файла
      - name: Build APK with Gradle
        run: ./gradlew assembleAfatDebug --continue

      # 5. Выгрузка готового APK в раздел Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
